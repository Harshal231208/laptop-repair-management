<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Customer Login — RepairBench</title><link rel="stylesheet" href="css/style.css">
</head>
<body>
<header class="site-header"><div class="wrap"><a href="index.html" class="brand">RepairBench</a><nav class="main-nav" id="mainNav"><a href="index.html">Home</a><a href="submit.html">Submit Ticket</a><a href="track.html">Track Repair</a><a href="jobs.html">All Jobs</a><a href="about.html">About</a><a href="contact.html">Contact</a><a href="admin-login.html">Admin</a></nav><button class="nav-toggle" id="navToggle" aria-label="Toggle menu">☰</button></div></header>
<section class="page-head"><div class="wrap"><div class="hero-eyebrow">// customer access</div><h1>Welcome back</h1><p>Sign in to view your repair tickets and track their progress.</p></div></section>
<section class="wrap login-wrap"><div class="panel login-panel">
<form id="loginForm">
<div class="field"><label for="email">Email</label><input type="email" id="email" autocomplete="email" required maxlength="254" pattern="[^\s@]+@[^\s@]+\.[^\s@]+"></div>
<div class="field"><label for="password">Password</label><input type="password" id="password" autocomplete="current-password" required minlength="8" maxlength="128"></div>
<p id="loginError" class="login-error" hidden></p><button type="submit" class="btn btn-copper btn-block" id="loginBtn">Sign in</button>
<p class="auth-switch">New to RepairBench? <a href="register.html">Create an account</a></p>
</form></div></section>
<footer class="site-footer"><div class="wrap"><p>RepairBench — laptop repair management</p><p>Customer portal</p></div></footer>
<script src="js/main.js"></script><script src="js/toast.js"></script><script src="js/customer-auth.js"></script>
<script>
const form=document.getElementById('loginForm'), error=document.getElementById('loginError'), btn=document.getElementById('loginBtn');
form.addEventListener('submit',async e=>{e.preventDefault();error.hidden=true;if(!validateForm(form)) return;btn.disabled=true;btn.textContent='Signing in…';try{const r=await fetch(`${API_URL}/customer/login`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:document.getElementById('email').value.trim(),password:document.getElementById('password').value})});const contentType=r.headers.get('content-type')||'';
let d;
if(contentType.includes('application/json')){
  d=await r.json();
}else{
  const raw=await r.text();
  throw new Error('The RepairBench API is returning an HTML page instead of JSON. Please redeploy the backend API and make sure the frontend API_URL points to the Railway backend.');
}if(!r.ok)throw new Error(d.error||'Unable to sign in.');customerAuth.save(d);location.href='account.html';}catch(err){error.textContent=err.message;error.hidden=false;}finally{btn.disabled=false;btn.textContent='Sign in';}});
</script></body></html>
